# Apache lines for the HTTPS site (000-default-le-ssl.conf), inside <VirtualHost *:443>.
# They forward https://<host>/csat/... to the Node app, without the /csat prefix.
# Needs the proxy modules: a2enmod proxy proxy_http
# The README has a command that adds these lines safely.

    # CSAT app: forward /csat/ to the Node app on port 3000
    RedirectMatch 301 ^/csat$ /csat/
    ProxyPreserveHost On
    ProxyPass /csat/ http://127.0.0.1:3000/
    ProxyPassReverse /csat/ http://127.0.0.1:3000/
